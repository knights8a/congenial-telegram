<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f0f4ff, #dfe9ff);
    }

    .calculator {
      width: min(320px, calc(100vw - 32px));
      background: #1e1e2f;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .display {
      width: 100%;
      height: 70px;
      border: none;
      border-radius: 12px;
      background: #2d2d44;
      color: white;
      font-size: 2rem;
      text-align: right;
      padding: 10px 15px;
      margin-bottom: 18px;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    button:hover { opacity: 0.95; }
    button:active { transform: scale(0.98); }
    button:focus-visible { outline: 3px solid white; outline-offset: 2px; }

    .operator {
      background: #ffb703;
      color: #111;
      font-weight: bold;
    }

    .number { background: #e9edf7; color: #222; }
    .clear { background: #ff6b6b; color: white; }

    .equals {
      background: #4cc9f0;
      color: #04151f;
      grid-column: span 2;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <input class="display" id="display" type="text" aria-label="Calculator display" disabled />

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="appendValue('/')" aria-label="Divide">÷</button>
      <button class="operator" onclick="appendValue('*')" aria-label="Multiply">×</button>
      <button class="operator" onclick="deleteLast()">DEL</button>

      <button class="number" onclick="appendValue('7')">7</button>
      <button class="number" onclick="appendValue('8')">8</button>
      <button class="number" onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('-')" aria-label="Subtract">−</button>

      <button class="number" onclick="appendValue('4')">4</button>
      <button class="number" onclick="appendValue('5')">5</button>
      <button class="number" onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('+')" aria-label="Add">+</button>

      <button class="number" onclick="appendValue('1')">1</button>
      <button class="number" onclick="appendValue('2')">2</button>
      <button class="number" onclick="appendValue('3')">3</button>
      <button class="equals" onclick="calculateResult()">=</button>

      <button class="number" onclick="appendValue('0')" style="grid-column: span 2;">0</button>
      <button class="number" onclick="appendValue('.')">.</button>
      <button class="operator" onclick="appendValue('%')">%</button>
    </div>
  </main>

  <script>
    const display = document.getElementById('display');
    const operators = ['+', '-', '*', '/', '%'];

    function appendValue(value) {
      if (display.value === 'Error') display.value = '';

      const current = display.value;
      const lastChar = current.slice(-1);

      if (operators.includes(value)) {
        if (!current || operators.includes(lastChar)) return;
      }

      if (value === '.' && lastChar === '.') return;
      display.value = current + value;
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    function clearDisplay() {
      display.value = '';
    }

    function calculateResult() {
      try {
        let expression = display.value;
        if (!expression) return;

        // A trailing operator does not form a complete expression.
        if (operators.includes(expression.slice(-1))) {
          throw new Error('Incomplete expression');
        }

        // Percent converts a number to a percentage (for example, 50% becomes 0.5).
        expression = expression.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');

        if (!/^[0-9+\-*/().\s]+$/.test(expression)) {
          throw new Error('Invalid expression');
        }

        const result = Function(`"use strict"; return (${expression});`)();
        if (!Number.isFinite(result)) throw new Error('Invalid result');

        display.value = Number.isInteger(result)
          ? String(result)
          : String(Number(result.toFixed(10)));
      } catch {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
